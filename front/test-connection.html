<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试服务器连接</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 10px 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>服务器连接测试</h1>
    <button onclick="testHealth()">测试健康检查</button>
    <button onclick="testStartGame()">测试开始游戏</button>
    <div id="result"></div>

    <script>
        const API_BASE_URL = 'http://localhost:3000/api';

        async function testHealth() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '正在测试...';
            
            try {
                const response = await fetch('http://localhost:3000/health');
                const data = await response.json();
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `✅ 健康检查成功！<br>${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `❌ 连接失败！<br>错误: ${error.message}<br><br>请检查：<br>1. 后端服务器是否正在运行<br>2. 服务器地址是否为 http://localhost:3000`;
            }
        }

        async function testStartGame() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '正在测试开始游戏...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/game/start`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        instruction: '测试指令'
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `✅ 开始游戏成功！<br>游戏ID: ${data.gameId}`;
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `❌ 开始游戏失败！<br>错误: ${error.message}<br><br>请检查：<br>1. 后端服务器是否正在运行<br>2. 数据库连接是否正常`;
            }
        }
    </script>
</body>
</html>
